[package]
name = "inkling-books"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
html-escape = "0.3"
pdf-extract = "0.12"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The parser GPUI Kit reads Markdown with, so the escaping is checked against what draws it.
markdown = "=1.0.0"
proptest = "1.12"
tempfile = "3"
