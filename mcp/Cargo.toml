[package]
name = "inkling-mcp"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
inkling-books = { workspace = true }
inkling-core = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.12"
tempfile = "3"
