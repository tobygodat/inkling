[package]
name = "inkling-mcp"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
inkling-books = { workspace = true }
inkling-core = { workspace = true }
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
proptest = "1.12"
tempfile = "3"
