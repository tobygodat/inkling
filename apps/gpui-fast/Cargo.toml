[package]
name = "inkling-gpui-fast"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
snap = ["gpui/test-support", "gpui_platform/test-support", "dep:anyhow", "dep:image"]

[dependencies]
inkling-core = { path = "../../core" }
gpui = { package = "gpui-fast", version = "=0.1.14", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.14", features = ["font-kit", "runtime_shaders"] }
anyhow = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[[bin]]
name = "inkling"
path = "src/main.rs"

[[bin]]
name = "snap"
path = "src/bin/snap.rs"
required-features = ["snap"]

[profile.release]
strip = true
