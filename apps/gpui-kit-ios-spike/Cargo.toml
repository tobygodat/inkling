[workspace]
resolver = "3"

[package]
name = "gpui-kit-ios-spike"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component"] }
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui-mobile = { package = "gpui-pre-mobile", path = "target/gpui-mobile", default-features = false, features = ["video_player", "camera"] }
log = "0.4"
objc2 = "0.6"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
