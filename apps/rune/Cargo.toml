[workspace]
resolver = "3"
members = ["app", "mac"]

[workspace.dependencies]
inkling-core = { path = "../../core" }
inkling-app = { path = "app" }
rune = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984" }

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.release]
lto = "thin"
