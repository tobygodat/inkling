[workspace]
resolver = "3"

[package]
name = "rune-ios-spike"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2
