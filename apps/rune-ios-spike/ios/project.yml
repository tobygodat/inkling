name: RuneSpike
options:
  bundleIdPrefix: com.tobygodat.inkling
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  RuneSpike:
    type: application
    platform: iOS
    sources:
      - path: Spike
    preBuildScripts:
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          exec "$PROJECT_DIR/../cargo-ios.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobygodat.inkling.runespike
        PRODUCT_NAME: RuneSpike
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Spike/Spike.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rune Spike
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        RUST_TARGET_DIR: $(PROJECT_DIR)/../target
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(RUST_TARGET_DIR)/aarch64-apple-ios-sim/debug
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(RUST_TARGET_DIR)/aarch64-apple-ios/debug
        OTHER_LDFLAGS:
          - -lrune_ios_spike
          - -framework Metal
          - -framework QuartzCore
          - -framework CoreText
          - -framework CoreGraphics
          - -framework CoreFoundation
          - -framework Foundation
          - -framework UIKit
