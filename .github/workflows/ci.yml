name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Clippy and tests
    # GPUI builds its Metal shaders with Xcode, so the workspace only compiles on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: actions/cache@v4
        with:
          path: target/fixtures
          key: book-fixtures-${{ hashFiles('books/fetch-fixtures.sh') }}

      - name: Fetch the real books inkling-books tests read
        run: books/fetch-fixtures.sh

      - name: Tests
        run: cargo test --workspace

  server:
    name: Server types and tests
    # The Worker in server/ (ADR 0004). Its tests run in workerd with local D1 and KV.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run check

      - name: Tests
        run: bun run test
