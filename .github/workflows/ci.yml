name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Clippy, tests and Mac snap
    # GPUI builds its Metal shaders with Xcode, so the workspace only compiles on macOS.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: actions/cache@v4
        with:
          path: target/fixtures
          key: book-fixtures-${{ hashFiles('books/fetch-fixtures.sh') }}
          # An edit to the script changes the key. The last books it fetched still serve the tests.
          restore-keys: book-fixtures-

      - name: Fetch the real books inkling-books tests read
        run: books/fetch-fixtures.sh

      - name: Tests
        run: cargo test --workspace

      - name: Mac snap
        # Renders offscreen and asserts the app's flows, accessibility included, into a temp folder.
        run: INKLING_SNAP_OUT="$(mktemp -d)" mac/snap.sh

  ios-build:
    name: iPhone build
    # ios/ is its own Cargo workspace over gpui-mobile, so the check job never builds it.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
          rustup target add aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios -> target

      - name: Fetch gpui-mobile
        run: ios/fetch-mobile.sh

      - name: Clippy
        run: cargo clippy --manifest-path ios/Cargo.toml --target aarch64-apple-ios-sim -- -D warnings

      - name: Build the Simulator app
        run: ios/run.sh

  swift-core:
    name: Swift core package and native app
    # inkling-ffi as the native app sees it (ADR 0007): the XCFramework, its Swift side and the
    # package's tests, then the native app's snapshot tests offscreen on the Mac and on a Simulator.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: target/fixtures
          key: book-fixtures-${{ hashFiles('books/fetch-fixtures.sh') }}
          restore-keys: book-fixtures-

      - name: Build InklingCore
        run: PROFILE=dev apple/core.sh

      - name: Swift tests
        run: swift test --package-path apple/InklingCore

      - name: Mac snapshots
        run: INKLING_SNAP_OUT="$RUNNER_TEMP/snap" apple/snap.sh mac

      - name: iPhone snapshots
        run: |
          runtime=$(xcrun simctl list runtimes iOS --json | jq -r '[.runtimes[] | select(.isAvailable)] | last | .identifier')
          model=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .identifier')
          udid=$(xcrun simctl create snapshots "$model" "$runtime")
          xcrun simctl boot "$udid"
          INKLING_SNAP_OUT="$RUNNER_TEMP/snap" apple/snap.sh iphone "$udid"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-app-screenshots
          path: ${{ runner.temp }}/snap
          if-no-files-found: ignore

  server:
    name: Server types and tests
    # The Worker in server/ (ADR 0004). Its tests run in workerd with local D1 and KV.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run check

      - name: Tests
        run: bun run test
