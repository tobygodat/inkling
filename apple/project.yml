# The native Inkling app (ADR 0007): one SwiftUI app for the Mac and the iPhone over InklingCore.
# apple/snap.sh generates Inkling.xcodeproj from this with XcodeGen; the project isn't committed.
name: Inkling
options:
  bundleIdPrefix: com.tobygodat
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: Q6NAWA42Y2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # InklingCore's XCFramework is built for Apple silicon only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
packages:
  InklingCore:
    path: InklingCore
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.6.0"
targets:
  Inkling:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Inkling
      - path: ../ui/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: InklingCore
      - package: Markdown
    settings:
      base:
        # Its own id while the GPUI app keeps com.tobygodat.inkling, so both install side by side.
        PRODUCT_BUNDLE_IDENTIFIER: com.tobygodat.inkling.native
        PRODUCT_NAME: Inkling
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inkling
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: YES
  InklingMacSnapshots:
    type: bundle.unit-test
    platform: macOS
    # The app's own views and model, compiled into the bundle, rendered offscreen: no app launches
    # and no window comes to the front.
    sources:
      - path: Inkling
        excludes: ["InklingApp.swift"]
      - path: Snapshots/Mac
      - path: ../ui/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: InklingCore
      - package: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobygodat.inkling.native.mac-snapshots
        GENERATE_INFOPLIST_FILE: YES
  InklingPhoneSnapshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Snapshots/Phone
    dependencies:
      - target: Inkling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobygodat.inkling.native.phone-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Inkling
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Inkling:
    build:
      targets:
        Inkling: all
  MacSnapshots:
    build:
      targets:
        InklingMacSnapshots: [test]
    test:
      targets: [InklingMacSnapshots]
  PhoneSnapshots:
    build:
      targets:
        Inkling: all
        InklingPhoneSnapshots: [test]
    test:
      targets: [InklingPhoneSnapshots]
