name: Inkling
options:
  bundleIdPrefix: com.tobygodat.inkling
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Inkling:
    type: application
    platform: iOS
    sources:
      - path: Inkling
    preBuildScripts:
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          exec "$PROJECT_DIR/../cargo-ios.sh"
    settings:
      configs:
        Release:
          RUST_PROFILE: release
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobygodat.inkling
        PRODUCT_NAME: Inkling
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Inkling/Inkling.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        DEAD_CODE_STRIPPING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inkling
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        RUST_TARGET_DIR: $(PROJECT_DIR)/../target
        RUST_PROFILE: debug
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "RUST_LIB[sdk=iphonesimulator*]": $(RUST_TARGET_DIR)/aarch64-apple-ios-sim/$(RUST_PROFILE)/libinkling_ios.a
        "RUST_LIB[sdk=iphoneos*]": $(RUST_TARGET_DIR)/aarch64-apple-ios/$(RUST_PROFILE)/libinkling_ios.a
        OTHER_LDFLAGS:
          - -force_load
          - $(RUST_LIB)
          - -lc++
          - -ObjC
          - -framework UIKit
          - -framework Metal
          - -framework MetalKit
          - -framework QuartzCore
          - -framework CoreGraphics
          - -framework CoreText
          - -framework CoreFoundation
          - -framework Foundation
          - -framework Security
          - -framework SystemConfiguration
          - -framework AVFoundation
          - -framework CoreMedia
          - -framework AudioToolbox
