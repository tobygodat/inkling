[package]
name = "inkling-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.7", default-features = false }
unicode-segmentation = "1.13"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3.7"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.12"
