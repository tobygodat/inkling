[package]
name = "inkling-mac"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "inkling"
path = "src/main.rs"

[features]
snap = ["gpui-kit/test-support", "dep:serde_json"]

[dependencies]
gpui-kit = { workspace = true, features = ["gpui-fast"] }
inkling-core.workspace = true
inkling-ui.workspace = true
serde_json = { version = "1", optional = true }
